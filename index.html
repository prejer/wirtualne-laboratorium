<style>

.howto{background:#f1f5fb;border:1px solid #d3ddf0;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:13.5px}.howto ol{margin:4px 0;padding-left:20px}.howto li{margin:3px 0}

.tcard{display:flex;flex-direction:column;text-align:left;font:inherit;color:var(--ink);background:#fffdf8;border:0;border-radius:16px;overflow:hidden;cursor:pointer;padding:0;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s}

.tcard .tsvg{background:linear-gradient(180deg,#e6e9ed,#cfd4da);height:170px;display:flex;align-items:center;justify-content:center}
.tcard .tsvg svg{width:100%;height:100%}
.tcard .tbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

.pill.zad{background:#c2410c}

#nbp header b{font:700 16px Georgia,serif}
#clock{margin-left:auto;margin-right:10px;font:600 13px ui-monospace,Menlo,monospace;color:#5f6676}
#nbsc{padding:4px 14px 30px}#nbsc h4{font:700 15px Georgia,serif;margin:16px 0 4px}
#stepper{position:sticky;top:0;z-index:2;display:flex;background:#fffdf8;border-bottom:1px solid #dcd5c3}
#stepper button{flex:1;border:0;background:none;padding:9px 2px 8px;font:inherit;font-size:12px;color:#5f6676;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:3px solid transparent}
#stepper button i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1.5px solid #c8c0aa;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
#stepper button.on{color:#1b2130;font-weight:700;border-bottom-color:#c2410c}
#stepper button.on i{background:#c2410c;border-color:#c2410c;color:#fff}
#stepper button.done i{background:#15803d;border-color:#15803d;color:#fff}
#stepBody{padding:10px 14px 20px}
#stepBody h4{font:700 15px Georgia,serif;margin:16px 0 4px}
#stepBody textarea{width:100%;font:inherit;font-size:14px;padding:8px;border:1px solid #c8c0aa;border-radius:8px;resize:vertical;background:#fff}
.q{font:600 15.5px/1.4 Georgia,serif;background:#fff3e8;border-left:4px solid #c2410c;padding:9px 12px;border-radius:0 8px 8px 0}
.lbl{font-size:12px;font-weight:700;color:#5f6676;margin:12px 0 4px;text-transform:none}
ul.eq{margin:0;padding-left:18px;font-size:13.5px;columns:2;column-gap:18px}
ul.pit{padding-left:18px;font-size:13.5px}ul.pit li{margin:5px 0}
.hint{background:#f1f5fb;border:1px solid #d3ddf0;border-radius:8px;padding:7px 10px;margin:8px 0;font-size:13.5px}
.ans{background:#e8f3ea;border:1px solid #b7dcc0;border-radius:8px;padding:9px 11px;margin:10px 0;font-size:13.5px}
.ans.warn{background:#fff8d6;border-color:#e6d58a}
.tw{overflow-x:auto}
input.u{width:64px;font:inherit;font-size:13px;padding:4px 6px;border:1px solid #c8c0aa;border-radius:6px}
.own{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:14px}.own input{width:90px;font:inherit;font-size:14px;padding:5px 7px;border:1px solid #c8c0aa;border-radius:6px}
table.cmpt{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:6px}.cmpt th,.cmpt td{border-bottom:1px solid #eee7d6;padding:5px 4px;text-align:left}
.pts label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #eee7d6;font-size:13.5px}.pts label span{flex:1}.pts label b{white-space:nowrap}
.tot{font-size:15px;margin:10px 0}
#hide{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(28,33,41,.82);backdrop-filter:blur(8px)}
#hide.on{display:flex}
.hidebox{max-width:460px;background:#fffdf8;border-radius:16px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.hidebox h3{font:700 21px Georgia,serif;margin:4px 0 8px}.hidebox ul{columns:2;font-size:13.5px;padding-left:18px}
@media(min-width:900px){#nbp.on{width:min(420px,36vw)}}
.seg{display:inline-flex;gap:0;margin-right:6px}.seg .pill{border-radius:0}.seg .pill:first-child{border-radius:999px 0 0 999px}.seg .pill:last-child{border-radius:0 999px 999px 0}
#status:empty{display:none}
#help{position:absolute;top:56px;right:12px;z-index:6;background:rgba(255,255,255,.96);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:12px 14px;font-size:13px;max-width:430px;display:none}#help.on{display:block}#help table{border-collapse:collapse;margin:6px 0 8px}#help td{padding:3px 8px 3px 0;vertical-align:top}#help td:first-child{color:#666;white-space:nowrap}kbd{display:inline-block;border:1px solid #ccc;border-bottom-width:2px;border-radius:4px;padding:0 5px;font:600 11px system-ui;margin-right:2px;background:#fafafa}
/* --- LabShell: dock --- */
#dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;display:flex;align-items:stretch;z-index:3;padding:6px;border-radius:20px;background:rgba(255,253,248,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 34px rgba(20,25,40,.22),0 0 0 1px rgba(0,0,0,.06);max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.dsec{display:flex;gap:2px;flex:0 0 auto}#dock{justify-content:flex-start}.dsplit{flex:0 0 1px;margin:8px 10px;background:rgba(0,0,0,.16)}
#dockMove{padding:0 2px;border-radius:15px;background:rgba(30,90,168,.06)}
.tool{flex:0 0 auto;width:84px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding:9px 4px 8px;border:1.5px solid transparent;border-radius:14px;background:transparent;color:#1b2130;font:600 11.5px/1.18 system-ui,sans-serif;text-align:center;cursor:pointer;transition:background .15s,transform .1s,border-color .15s}
.tool svg{width:26px;height:26px;stroke:#1b2130;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.tool:hover{background:rgba(30,90,168,.09)}.tool:hover svg{transform:translateY(-2px)}.tool:active{transform:scale(.94)}
.tool.mv svg{stroke:#1e5aa8}
.tool.mv.active{background:#1e5aa8;color:#fff;border-color:#0f3d7a;box-shadow:0 0 0 3px rgba(30,90,168,.22)}.tool.mv.active svg{stroke:#fff}
.tool.pulse{animation:pulse .5s}@keyframes pulse{0%{background:rgba(30,90,168,.25)}100%{background:transparent}}
/* --- panel Nauki (tylko w trybie Nauka) --- */
#learn{position:absolute;left:12px;top:58px;z-index:3;min-width:250px;max-width:min(340px,calc(100% - 24px));background:rgba(255,255,255,.95);border-radius:12px;box-shadow:0 8px 28px rgba(20,25,40,.16),0 0 0 1px rgba(0,0,0,.06);padding:8px 12px 10px;font-size:13px;opacity:0;transform:translateX(-14px);pointer-events:none;transition:opacity .28s,transform .28s;visibility:hidden}
#learn.on{opacity:1;transform:none;pointer-events:auto;visibility:visible}
#learn .lh{font:700 11px system-ui;letter-spacing:.04em;text-transform:uppercase;color:#7c3aed;margin:2px 0 6px}
#learn .lr{display:flex;justify-content:space-between;gap:14px;padding:2.5px 0;border-top:1px solid rgba(0,0,0,.05)}#learn .lr span{color:#555}#learn .lr b{font-variant-numeric:tabular-nums}
.pill.ico{padding:0 9px;display:inline-flex;align-items:center}.pill.ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
#ver{position:absolute;right:10px;bottom:6px;font:11px system-ui;color:rgba(27,33,48,.38);z-index:4;cursor:pointer;padding:4px}
#diag{display:none;position:absolute;right:10px;bottom:28px;z-index:6;margin:0;padding:10px 12px;background:rgba(20,24,32,.92);color:#cfe3ff;font:11px/1.45 ui-monospace,monospace;border-radius:10px;max-width:min(520px,calc(100% - 20px));white-space:pre-wrap}
/* --- propozycja instalacji (PWA) --- */
#install{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:12px;width:min(620px,calc(100% - 24px));padding:12px 14px;background:#fffdf8;border-radius:16px;box-shadow:0 14px 40px rgba(10,14,22,.35),0 0 0 1px rgba(0,0,0,.06);animation:instIn .35s ease-out}
@keyframes instIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
#install img{width:48px;height:48px;border-radius:11px;flex:0 0 auto}#install .it{flex:1;display:flex;flex-direction:column;gap:2px;font-size:13px;color:#444}#install .it b{color:#1b2130}#install .it>b{font-size:15px}
#install .ib{display:flex;gap:6px;flex:0 0 auto}@media (max-width:560px){#install{flex-wrap:wrap}#install .ib{width:100%;justify-content:flex-end}}
/* --- bramka: na razie tylko komputery --- */
#gate{display:none;position:fixed;inset:0;z-index:100;background:#20262f;color:#e8ecf2;align-items:center;justify-content:center;padding:24px}
#gate.on{display:flex}#gate .gbox{max-width:520px;text-align:center}#gate img{width:84px;height:84px;border-radius:20px;margin-bottom:14px}
#gate h1{font:700 24px/1.25 Georgia,serif;margin:0 0 12px}#gate p{margin:0 0 10px;color:#b9c2d0;font-size:15px}#gate .soon{color:#f3b38a}#gate a{display:inline-block;margin-top:14px;color:#8fb4e8;font-size:13px}
</style>
</head>
<body>
<div id="main">
<div id="stage"><canvas id="cv"></canvas><!-- ramę (górny pasek, dock, panel Nauki) buduje LabShell w engine.js --></div>
</div>
<div class="ov on" id="startOv"><div class="box"></div></div>
<div class="ov" id="taskOv"><div class="box" id="taskBox"></div></div>

<div id="catalog"></div>
<div id="gate"><div class="gbox"><img src="icons/icon-192.png" alt=""><h1>Wirtualne Laboratorium działa na razie na komputerach</h1>
<p>Otwórz je na laptopie lub komputerze stacjonarnym — w Chrome, Edge, Firefoksie albo Safari.</p>
<p class="soon">Wersja na telefony i tablety — <b>wkrótce</b>.</p>
<a href="#" id="gateTry">Spróbuj mimo to (wersja testowa)</a></div></div>
<script>
// Na razie tylko komputery: na tabletach i telefonach przeglądarki odbierają grafikę 3D (wersja mobilna w przygotowaniu).
(function(){var ua=navigator.userAgent,mm=function(q){return window.matchMedia&&matchMedia(q).matches};
 var mobile=/Android|iPhone|iPad|iPod|Mobile/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)||(mm("(pointer:coarse)")&&!mm("(any-pointer:fine)"));
 var ok=false;try{ok=localStorage.getItem("lab-mobile-ok")==="1"}catch(e){}
 window.LAB_MOBILE=mobile;
 function load(){document.getElementById("gate").remove();var a=document.createElement("script");a.src="zadania/index.js?v=0.11";a.onload=function(){var b=document.createElement("script");b.src="engine.js?v=0.11";document.body.appendChild(b)};document.body.appendChild(a)}
 if(!mobile||ok){load();return}
 document.getElementById("gate").classList.add("on");
 document.getElementById("gateTry").onclick=function(e){e.preventDefault();try{localStorage.setItem("lab-mobile-ok","1")}catch(_){}load()}})();
</script>
</body>
