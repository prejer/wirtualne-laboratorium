<style>
:root{--ink:#1b2130;--muted:#5f6676;--line:#dcd5c3;--acc:#c2410c;--blue:#1e5aa8;--ok:#15803d;--bad:#b91c1c;--warn:#a16207;--card:#fffdf8}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#20262f;display:flex;height:100dvh;-webkit-user-select:none;user-select:none}
#main{flex:1;display:flex;flex-direction:column;min-width:0}

.resume{background:#e8f3ea;border:1px solid #b7dcc0;border-radius:8px;padding:8px 10px;font-size:13.5px}
#stage{flex:1;position:relative;min-height:0;background:linear-gradient(#dfe3e8,#b9bcc0)}
#glc{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:transparent}
.top{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;z-index:2}
.top>*{pointer-events:auto}
#views{display:contents}
.pill{background:rgba(27,33,48,.88);color:#eef0f3;border:0;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;min-height:32px}
.pill.on{background:#fff;color:#1b2130;font-weight:700}
.sp{flex:1}
#status{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.1);background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:12.5px;max-width:calc(100% - 16px);z-index:2;border-radius:999px}
#hint{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);background:rgba(27,33,48,.9);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;max-width:80%;text-align:center;pointer-events:none;z-index:2;transition:opacity .4s;opacity:0}
#panel{flex:none;height:min(42dvh,340px);background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column}
#tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#tabs button{flex:1;border:0;background:none;padding:10px 8px;font:inherit;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
#tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--acc)}
#panes{flex:1;min-height:0;display:flex}
.pane{display:none;padding:6px 12px 14px;overflow-y:auto;flex:1}
.pane.on{display:block}
.ctl{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:8px;align-items:center;margin:6px 0}
.ctl label{font-size:13px;color:var(--muted)}
input[type=range]{width:100%;height:28px}
.fine{display:flex;gap:4px}
.fine button,.btn{font:inherit;font-size:14px;border:1px solid #c8c0aa;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink);min-height:38px;touch-action:manipulation}
.fine button{min-width:40px;padding:6px 4px;touch-action:none}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.a{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.big{font-size:16px;padding:10px 18px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:7px 0}
#draftS,#draftK{background:#fff8d6;border:1px solid #e6d58a;border-radius:8px;padding:6px 10px;font-size:13px;margin:6px 0}
.cnt{font:700 26px ui-monospace,Menlo,monospace;min-width:48px;text-align:center}
.small{font-size:12.5px;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(12,15,22,.55);display:none;z-index:10;align-items:center;justify-content:center;padding:12px}
.ov.on{display:flex}
.box{background:var(--card);border-radius:16px;max-width:600px;width:100%;max-height:92dvh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.35);-webkit-user-select:text;user-select:text;font-size:14.5px}
.box h2{font:700 22px/1.2 Georgia,serif;margin:4px 0 8px}
.box ul{margin:4px 0;padding-left:20px}
.kick{font-size:12px;color:var(--acc);font-weight:700}
details{margin-top:8px}summary{cursor:pointer;color:var(--blue);font-weight:600}
#nbp{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--card);z-index:9;transform:translateX(102%);transition:transform .22s;box-shadow:-8px 0 30px rgba(0,0,0,.25);display:flex;flex-direction:column;-webkit-user-select:text;user-select:text}
#nbp.on{transform:none}
@media(min-width:900px){#nbp{position:static;transform:none;width:0;overflow:hidden;box-shadow:none;border-left:1px solid #dcd5c3;transition:width .2s}#nbp.on{width:min(460px,40vw)}#nbX{display:none}}
.howto{background:#f1f5fb;border:1px solid #d3ddf0;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:13.5px}.howto ol{margin:4px 0;padding-left:20px}.howto li{margin:3px 0}
#nbp header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
#nbsc{overflow:auto;padding:8px 14px 40px;flex:1}
#nbsc h3{font:700 16px Georgia,serif;margin:18px 0 6px}
table.nb{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.nb th,.nb td{border:1px solid var(--line);padding:0;text-align:center}
.nb th{font-size:12px;color:var(--muted);font-weight:600;background:#f4f1ea;padding:4px 2px}
.nb td.c{color:var(--blue);font-weight:600;font-size:13.5px;padding:0 4px}
.nb td.i{font-size:12px;color:var(--muted);width:24px;background:#f4f1ea}
.nb input{width:100%;min-width:52px;border:0;background:transparent;padding:7px 3px;font:inherit;font-size:14px;text-align:center}
.nb input:focus{outline:2px solid var(--blue);background:#fff}
.del{border:0;background:none;color:#b91c1c;font-size:18px;cursor:pointer;padding:0 6px}
canvas.plot{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:6px}
.res{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#f1f5fb;border:1px solid #d3ddf0;border-radius:8px;padding:8px 10px;white-space:pre-wrap;margin-top:6px}
.pts label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid #eee7d6;font-size:13.5px}
.pts label b{margin-left:auto;white-space:nowrap}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.warn{color:var(--warn);font-weight:700}
@font-face{font-family:"Archivo";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;src:url(fonts/archivo-latin-ext-standard-normal.woff2) format("woff2-variations");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Archivo";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;src:url(fonts/archivo-latin-standard-normal.woff2) format("woff2-variations");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"STIX Two Text";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/stix-two-text-latin-400-italic.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:"STIX Two Text";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/stix-two-text-greek-400-italic.woff2) format("woff2");unicode-range:U+0370-03FF}
@font-face{font-family:"STIX Two Text";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/stix-two-text-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2212}
/* strona główna: spokojna, „podręcznikowa” — biel i szarość laboratoryjna, granat jako kolor wiodący, żółć multimetru tylko na głównym przycisku,
   papier milimetrowy jako tło nagłówka, wzory składane krojem matematycznym (STIX) */
#catalog{--bg:#ffffff;--bg2:#f3f5f6;--ink:#17212c;--ink2:#4a5664;--ink3:#6b7684;--line:#dfe4e8;--navy:#1f3d63;--yel:#e6b422;--rr:#c8372d;--rb:#2f62c6;--grid:rgba(31,61,99,.07);--grid2:rgba(31,61,99,.13);
 position:fixed;inset:0;z-index:20;display:none;overflow:auto;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Archivo",system-ui,sans-serif;-webkit-user-select:text;user-select:text}
#catalog.on{display:block}
#catalog *{box-sizing:border-box}
#catalog .wrap{max-width:1200px;margin:0 auto;padding-left:32px;padding-right:32px}
#catalog :focus-visible{outline:3px solid var(--rb);outline-offset:2px;border-radius:4px}
#catalog h1,#catalog h2,#catalog h3{color:var(--ink);font-weight:700;letter-spacing:-.012em;margin:0}
.fx{font-family:"STIX Two Text",Cambria,"Times New Roman",serif;font-style:italic;font-size:1.15em;letter-spacing:.01em;white-space:nowrap}
.sq{display:inline-block;border-top:1px solid currentColor;padding:0 2px;margin-left:1px;position:relative}
.sq::before{content:"√";position:absolute;left:-.62em;top:-.08em;font-style:normal}
.b{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:8px;border:1px solid transparent;background:var(--yel);color:var(--ink);font:600 15px/1 "Archivo",system-ui,sans-serif;text-decoration:none;cursor:pointer;white-space:nowrap}
.b:hover{background:#f0c63c}.b2{background:var(--bg);border-color:#c6ced6}.b2:hover{background:var(--bg2);border-color:var(--ink3)}
.b3{background:transparent;border:1px dashed #9aa5b1;color:var(--ink2);cursor:default}.b3:hover{background:transparent}
/* pasek nawigacji */
.nav{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.navin{display:flex;align-items:center;gap:28px;height:64px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:700;font-size:16.5px;letter-spacing:-.01em}
.brand img{border-radius:7px}
.navl{display:flex;gap:26px;margin-left:auto;font-size:15px}.navl a{color:var(--ink2);text-decoration:none}.navl a:hover{color:var(--navy)}
.navin .b{min-height:38px;padding:0 16px;font-size:14.5px}
/* nagłówek na papierze milimetrowym */
.hero{border-bottom:1px solid var(--line);background-color:#fbfcfc;background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:50px 50px,50px 50px,10px 10px,10px 10px;background-position:-1px -1px}
#catalog .heroin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:56px;align-items:center;padding-top:72px;padding-bottom:72px}
.hero h1{font-size:clamp(34px,4vw,52px);line-height:1.08;letter-spacing:-.02em;max-width:14em;text-wrap:balance}
.lead{font-size:18px;line-height:1.6;color:var(--ink2);margin:20px 0 28px;max-width:33em}
.hb{display:flex;flex-wrap:wrap;gap:12px}
.hnote{margin:22px 0 0;font-size:14px;color:var(--ink3)}
.hfig{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 18px 40px -24px rgba(23,33,44,.35)}
.hfig img{display:block;width:100%;height:auto;border-radius:6px}
.hfig figcaption{display:flex;gap:14px;align-items:baseline;padding:12px 6px 4px;font-size:14px;color:var(--ink2);line-height:1.5}
.hfig .fx{color:var(--navy);font-size:19px;flex:none}
/* sekcje */
.sec{padding:84px 0}.sec.alt{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec h2{font-size:clamp(26px,2.6vw,34px);line-height:1.15}
.steps{list-style:none;margin:36px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;counter-reset:k}
.steps li{counter-increment:k;position:relative;padding-top:58px}
.steps li::before{content:counter(k);position:absolute;top:0;left:0;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--navy);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:17px}
.steps li:not(:last-child)::after{content:"";position:absolute;top:20px;left:52px;right:-28px;border-top:1.5px dashed #b9c3cd}
.steps h3{font-size:19px;margin-bottom:8px}.steps p{margin:0;color:var(--ink2);font-size:15.5px;max-width:30em}
.sech{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:40px;align-items:baseline}
.sech p{margin:0;color:var(--ink2);max-width:44em}
.tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;margin:32px 0 22px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;min-height:36px;padding:0 14px;font:500 14.5px "Archivo",system-ui,sans-serif;color:var(--ink2);cursor:pointer}
.seg button span{color:var(--ink3);margin-left:4px;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}.seg button[aria-pressed="true"] span{color:#c9d6e6}
.dz{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--ink3)}.dz>span{margin-right:4px}
.dz button{border:1px solid var(--line);background:var(--bg);border-radius:999px;min-height:32px;padding:0 12px;font:500 14px "Archivo",system-ui,sans-serif;color:var(--ink2);cursor:pointer}
.dz button:hover{border-color:var(--ink3)}.dz button[aria-pressed="true"]{border-color:var(--navy);color:var(--navy);background:#e9eff6}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.kc[hidden]{display:none}
.kcb{display:flex;flex-direction:column;width:100%;height:100%;padding:0;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.kcb:hover{border-color:#b7c1cb;box-shadow:0 12px 28px -18px rgba(23,33,44,.4)}
.kimg{display:block;aspect-ratio:16/10;background:#e8ecef;border-bottom:1px solid var(--line)}.kimg img{display:block;width:100%;height:100%;object-fit:cover}
.kbody{display:flex;flex-direction:column;gap:6px;padding:16px 18px 18px;flex:1}
.kgr{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink2)}
.kgr::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rr)}.kgr.lo::before{background:var(--rb)}
.ktit{font-size:18.5px;font-weight:700;line-height:1.25;letter-spacing:-.01em;color:var(--ink)}
.kmeta{font-size:13px;color:var(--ink3)}
.kdesc{font-size:14.5px;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kfoot{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px}
.kfoot i{font-style:normal;font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--ink2)}
.kfoot i.prog{background:#e7f3ea;border-color:#c7e3cf;color:#22663a}
.empty{color:var(--ink3);padding:30px 0}
.szk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
.szt p{color:var(--ink2);margin:14px 0 24px;max-width:32em}
.szl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.szl li{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.szl b{font-weight:600}.szl span{color:var(--ink2)}
.foot{background:var(--navy);color:#d7e0ea}
#catalog .footin_old{display:flex;justify-content:space-between;gap:32px;padding-top:40px;padding-bottom:40px;font-size:14px}
.foot b{color:#fff;font-size:15px}.foot p{margin:8px 0 0;max-width:46em;line-height:1.6}.foot .ver{color:#9fb1c6;white-space:nowrap}
@media (max-width:1000px){#catalog .heroin{grid-template-columns:1fr;gap:40px;padding-top:48px;padding-bottom:56px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sech,.szk{grid-template-columns:1fr;gap:14px}.szk{gap:28px}}
@media (max-width:760px){.steps{grid-template-columns:1fr;gap:28px}.steps li::after{display:none}}
@media (max-width:620px){#catalog .wrap{padding-left:18px;padding-right:18px}.grid{grid-template-columns:1fr}.sec{padding:60px 0}.seg{width:100%;overflow-x:auto}.seg button{flex:none}.szl li{grid-template-columns:1fr;gap:4px}#catalog .footin{flex-direction:column}.hfig figcaption{flex-direction:column;gap:4px}}
@media (prefers-reduced-motion:reduce){.kcb{transition:none}}
.navl a[aria-current="page"]{color:var(--navy);font-weight:600;box-shadow:0 2px 0 var(--navy)}
.sech2{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}
.zhead{border-bottom:1px solid var(--line);background-color:#fbfcfc;background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:50px 50px,50px 50px,10px 10px,10px 10px;background-position:-1px -1px}
#catalog .zhead .wrap{padding-top:52px;padding-bottom:44px}
.zhead h1{font-size:clamp(30px,3.4vw,44px);line-height:1.1;letter-spacing:-.02em}
.zhead p{color:var(--ink2);margin:12px 0 26px;max-width:46em}
.srch{position:relative;max-width:640px}
.srch svg{position:absolute;left:16px;top:50%;width:20px;height:20px;transform:translateY(-50%);fill:none;stroke:var(--ink3);stroke-width:2;stroke-linecap:round}
.srch input{width:100%;height:52px;padding:0 18px 0 48px;border:1px solid #c6ced6;border-radius:10px;background:#fff;font:400 16.5px "Archivo",system-ui,sans-serif;color:var(--ink);box-shadow:0 1px 2px rgba(23,33,44,.05)}
.srch input:focus{outline:3px solid rgba(47,98,198,.25);border-color:var(--rb)}
#catalog .zlist{padding-top:28px}
.zlist .tools{margin:0 0 14px}
.tr{display:flex;align-items:center;gap:14px}
